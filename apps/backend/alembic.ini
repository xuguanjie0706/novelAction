# Alembic 配置（最小可用版本）。
#
# 设计说明：
#   - 在引入 Alembic 之前，本仓库通过 main.py 中的 _ensure_*_columns()
#     做开发期幂等迁移；现存"老库"已被这些 DDL 自动补齐。
#   - 引入 Alembic 是为后续生产环境提供版本化的迁移轨道，让"新增字段 / 重命名 /
#     删除"等不可幂等的变更可被审计、回滚。
#   - 本配置文件不写死 sqlalchemy.url，而是在 alembic/env.py 里读 app.config.settings
#     从而与运行期完全一致，不再需要双份 DSN。

[alembic]
script_location = alembic

# 时间戳前缀，便于按生成时间排序
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 时区（影响版本文件名）
timezone = Asia/Shanghai

# 从 env.py 读 DATABASE_URL，不要在此处填写
# sqlalchemy.url =


[post_write_hooks]
# 留空：本仓库未启用自动 lint hook


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
