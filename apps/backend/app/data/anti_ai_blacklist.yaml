# 反 AI 味黑名单（Anti-AI-flavor blacklist）
# ----------------------------------------------------
# 维护原则：
#   - 只收「读起来像 AI / 像翻译腔 / 像高考作文」的套话与修辞，不收专业术语。
#   - 每条 phrase 后面 hint 写「为什么避免 + 网文人怎么写」，模型才能改得到位。
#   - 若一条 phrase 在某些题材合理（例如「凝视着」在仙侠对峙是常见的），写在 except_genres，
#     否则模型会把所有合理用例一起改成怪话。
# ----------------------------------------------------
# 加载入口：app.services.anti_ai_blacklist.format_anti_ai_blacklist_for_prompt
# 单元测试：tests/services/test_anti_ai_blacklist.py（如缺失也允许编辑器静态校对）

categories:
  - name: 翻译腔修辞
    description: 句法过度欧化、像 AI 直译，没人这样说话。
    items:
      - phrase: 不可置否
        hint: AI 高频造词，正确写法是「无可置疑」「不容置喙」。
      - phrase: 不可名状
        hint: 起点已被读者打成 AI 标志词；改用「说不出的诡异」「形容不出的怪味」。
      - phrase: 不动声色地
        hint: 太书面，改成「面上没动静」「装作没事」「眼皮都没抬」。
      - phrase: 微微一笑
        hint: 烂大街，可改成具体动作，如「嘴角勾了下」「笑里带着钩」。
      - phrase: 嘴角勾起一抹弧度
        hint: AI 范文体，改成「嘴角往上一翘」即可。
      - phrase: 嘴角扯出一抹
        hint: 同上，"扯出一抹"是 AI 高频套语，删掉「一抹」直接写动作。
      - phrase: 缓缓开口道
        hint: 改成「他开口」「他说」「他低声」。
      - phrase: 缓缓道
        hint: 同上，去掉「缓缓」更利落。
      - phrase: 沉吟片刻
        hint: 改成「想了想」「停了停」「半晌没说话」。
      - phrase: 凝视着前方
        hint: 改成「盯着前面那道身影」，要带具体目标。
      - phrase: 不由得
        hint: 多余的连接词，多数情况可直接删。
      - phrase: 与此同时
        hint: 改成「同一刻」「就在这时」「另一头」。
      - phrase: 仿佛过了一个世纪
        hint: 翻译腔，改成「像过了好几年」「半天没回过神」。

  - name: 总结性独白
    description: AI 习惯每场戏后面贴一段「他明白了……」式总结，破坏沉浸。
    items:
      - phrase: 他明白了
        hint: 改成具体的动作或台词去示意"明白"，不要直接告诉读者。
      - phrase: 他意识到
        hint: 同上，让人物用一句话或一个行动表达。
      - phrase: 他突然明白
        hint: AI 经典烂尾，改成"那一刻他停住了脚步"再补具体反应。
      - phrase: 这一刻他终于
        hint: 套路顶针句，删掉前缀直接写动作。
      - phrase: 一切都变得清晰起来
        hint: 删掉。让事实自己显形，别替读者总结。
      - phrase: 心中五味杂陈
        hint: 烂大街心理描写，改成具体的躯体反应（手指收紧、喉咙发紧）。
      - phrase: 心中泛起一阵涟漪
        hint: 改成「心口跳了一下」「胸口闷了一拍」之类具体感受。

  - name: 网文反用力套话
    description: 网文读者最容易识别为「AI 写的」的固定句式。
    items:
      - phrase: 在场的所有人
        hint: 改成具体角色名，如「老掌柜、二楼客人、连掌柜的女儿都」。
      - phrase: 整个世界都安静了
        hint: 改成「整条街突然没声」「连风都停住」。
      - phrase: 时间仿佛静止
        hint: 改成「他没来得及眨眼」「鼓点漏了一拍」。
      - phrase: 空气中弥漫着
        hint: 改成具体的感官，如「酒糟味混着血腥味」「火油味呛得人皱眉」。
      - phrase: 不得不说
        hint: 解说员腔，删掉。
      - phrase: 总而言之
        hint: 议论文腔，改写成场景描述。
      - phrase: 综上所述
        hint: 同上，叙事里出现就是 AI 味。

  - name: 形容词堆叠
    description: 三连形容词是模型生成的典型节奏，读者一眼出戏。
    items:
      - phrase: 锋利、冰冷、致命
        hint: 任意三连形容词都要砍成一个具体动作。
      - phrase: 强大、神秘、莫测
        hint: 同上，挑一个真正派得上用场的，砍剩下的。
      - phrase: 无尽的、永恒的、绝望的
        hint: 抒情诗腔，全删；改成具体的感官细节。

  - name: 现代/科幻泄漏（兜底）
    description: 玄幻/古风正文里出现这些词必出戏；与 xuanhuan_lexicon 列表是补充关系。
    items:
      - phrase: 程序运行
        hint: 改成「阵法运转」「禁制启动」。
      - phrase: 系统提示
        hint: 改成具体的天降异象、神识感应、玉简显字。
      - phrase: 加载完成
        hint: 改成「阵眼亮起」「禁制贯通」。
