# 生产/隔离运行：不挂载本地源码，容器仅使用镜像内文件
# 端口映射沿用 docker-compose.yml 的环境变量约定

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: novel
      POSTGRES_DB: novel_db
    ports:
      - "${NOVEL_DOCKER_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${NOVEL_DOCKER_REDIS_HOST_PORT:-6379}:6379"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${NOVEL_DOCKER_BACKEND_HOST_PORT:-18080}:8000"
    environment:
      DATABASE_URL: postgresql://novel:novel@postgres:5432/novel_db
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    env_file:
      - ./apps/backend/.env
    depends_on:
      - postgres
      - redis
    entrypoint: ["scripts/docker-entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NOVEL_DOCKER_CLIENT_HOST_PORT:-19173}:3173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    command: sh -lc "pnpm install --frozen-lockfile && pnpm run dev -- --host 0.0.0.0 --port 3173"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NOVEL_DOCKER_ADMIN_HOST_PORT:-19174}:3174"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    command: sh -lc "pnpm install --frozen-lockfile && pnpm run dev -- --host 0.0.0.0 --port 3174"

volumes:
  postgres_data:
